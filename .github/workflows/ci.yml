name: CI - Huellas Dulces Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Preparar Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B clean verify

      - name: Verificar cobertura minima del 80 por ciento
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import sys

          path = "target/site/jacoco/jacoco.xml"

          try:
              root = ET.parse(path).getroot()
          except Exception as error:
              print(f"ERROR: No se pudo leer el reporte JaCoCo: {error}")
              sys.exit(1)

          failed = False

          for metric in ("LINE", "BRANCH"):
              counter = root.find(f"counter[@type='{metric}']")

              if counter is None:
                  print(f"ERROR: No existe el contador {metric}.")
                  failed = True
                  continue

              missed = int(counter.attrib["missed"])
              covered = int(counter.attrib["covered"])
              total = missed + covered
              percentage = covered / total * 100 if total else 0

              print(f"{metric}: {percentage:.2f}% (minimo: 80%)")

              if percentage < 80:
                  failed = True

          if failed:
              print("ERROR: La cobertura no cumple el minimo requerido.")
              sys.exit(1)

          print("Cobertura aprobada.")
          PY

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn