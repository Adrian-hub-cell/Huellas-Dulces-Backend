name: CI - Huellas Dulces Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, tests, coverage, SonarCloud and Docker
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configurar Java 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Preparar Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        env:
          SECURITY_JWT_SECRET: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
        run: ./mvnw -B clean verify

      - name: Verificar cobertura minima del 80 por ciento
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          import sys

          path = "target/site/jacoco/jacoco.xml"

          try:
              root = ET.parse(path).getroot()
          except Exception as error:
              print(f"ERROR: No se pudo leer el reporte JaCoCo: {error}")
              sys.exit(1)

          failed = False

          for metric in ("LINE", "BRANCH"):
              counter = root.find(f"counter[@type='{metric}']")

              if counter is None:
                  print(f"ERROR: No existe el contador {metric}.")
                  failed = True
                  continue

              missed = int(counter.attrib["missed"])
              covered = int(counter.attrib["covered"])
              total = missed + covered
              percentage = covered / total * 100 if total else 0

              print(f"{metric}: {percentage:.2f}% (minimo: 80%)")

              if percentage < 80:
                  failed = True

          if failed:
              print("ERROR: La cobertura no cumple el minimo requerido.")
              sys.exit(1)

          print("Cobertura aprobada.")
          PY

      - name: Analizar con SonarCloud
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Adrian-hub-cell_Huellas-Dulces-Backend \
            -Dsonar.organization=adrian-hub-cell \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      - name: Iniciar sesion en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: .
          push: true
          tags: |
            salomon09/huellas-dulces-backend:v1.0.0
            salomon09/huellas-dulces-backend:latest

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
