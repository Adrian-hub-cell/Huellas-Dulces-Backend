
# ==========================================
# HUELLAS DULCES - CONFIGURACION PRODUCCION
# ==========================================

spring.application.name=huellas-dulces
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# MongoDB
spring.mongodb.uri=${MONGODB_URI}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}

# Cache
spring.cache.type=redis

# JWT
security.jwt.secret=${JWT_SECRET}

# Hilos virtuales
spring.threads.virtual.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Informacion de la aplicacion
info.app.name=Huellas Dulces
info.app.description=API para la gestion de productos de Huellas Dulces
info.app.version=1.0.0

# Logs
logging.level.root=INFO
logging.level.com.huellasdulces=INFO
logging.level.io.github.resilience4j=INFO
