
# ==========================================
# HUELLAS DULCES - CONFIGURACION GENERAL
# ==========================================

spring.application.name=huellas-dulces
server.port=8080
spring.profiles.active=dev

# Hilos virtuales
spring.threads.virtual.enabled=true

# JSON
spring.jackson.default-property-inclusion=non_null

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Informacion de la aplicacion
info.app.name=Huellas Dulces
info.app.description=API para la gestion de productos de Huellas Dulces
info.app.version=1.0.0

# Circuit Breaker - Catalogo externo
resilience4j.circuitbreaker.instances.petFoodCatalog.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.petFoodCatalog.sliding-window-size=10
resilience4j.circuitbreaker.instances.petFoodCatalog.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.petFoodCatalog.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.petFoodCatalog.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.petFoodCatalog.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.petFoodCatalog.automatic-transition-from-open-to-half-open-enabled=true

# Tiempo limite de llamadas externas
resilience4j.timelimiter.instances.petFoodCatalog.timeout-duration=1500ms

# Logs
logging.level.root=INFO
logging.level.com.huellasdulces=DEBUG
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.web.client=DEBUG