services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: huellas_dulces
      POSTGRES_USER: huellas
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_.env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huellas -d huellas_dulces"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - huellas_network

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - huellas_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - huellas_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/huellas_dulces
      DB_USERNAME: huellas
      DB_PASSWORD: "${DB_PASSWORD:?Set_DB_PASSWORD_in_.env}"
      MONGODB_URI: mongodb://mongo:27017/huellas_dulces
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      JWT_SECRET: "${JWT_SECRET:?Set_JWT_SECRET_in_.env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set_ADMIN_PASSWORD_in_.env}"
      USER_PASSWORD: "${USER_PASSWORD:?Set_USER_PASSWORD_in_.env}"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - huellas_network

  web:
    build:
      context: ../Huellas-Dulces-Frontend
      dockerfile: Dockerfile
    image: huellas-dulces-frontend:1.0.1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - huellas_network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  huellas_network:
    driver: bridge
